services:
  db:
    image: postgres:16-alpine
    container_name: whiskypub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: whisky
      POSTGRES_PASSWORD: whisky
      POSTGRES_DB: whiskypub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
